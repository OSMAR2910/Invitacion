<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="shortcut icon" href="../img/icons/icon2.png" type="image/x-icon" />
  <link rel="stylesheet" href="../css/normalize.css">
  <link rel="stylesheet" href="../css/style.css">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#d8d8d8" />
  <meta name="msapplication-navbutton-color" content="#d8d8d8" />
  <meta name="apple-mobile-web-app-status-bar-style" content="#d8d8d8" />
  <title>Invitacion</title>
</head>
<body>    
  <section id="flexed">
  <div id="particles-js"></div>
</section>
  <section id="js-elementos">
      <div id="loader">
        <span class="loader__element"></span>
        <span class="loader__element"></span>
        <span class="loader__element"></span>
      </div>
      <div class="c-cursor | js-cursor">
        <div class="c-cursor__inner"></div>
      </div>
  </section>
  <section id="Login">
      <div class="Logincont">
          <div class="Login-cont">
              <div id="Login-son">
                <form class="formuariolog activolog" id="formuariolog">
                    <div class="wel" class="input-field">
                        <h3><span>Bienvenido</span></h3>
                        <p><span>Escribe su usuario y contraseña</span></p>
                    </div>
                    <div class="input-field">
                        <input id="user" type="text" name="user" required spellcheck="false">
                        <label><ion-icon name="person-outline"></ion-icon><span>Usuario</span></label>
                    </div>
                    <div class="input-field">
                        <input id="pass" type="password" name="Contraseña" required spellcheck="false">
                        <label><ion-icon name="lock-closed-outline"></ion-icon><span>Contraseña</span></label>
                    </div>
                    <div class="input-submit">
                        <input type="button" value="Listo" class="minimal-button" id="btn-submit" onclick="loguear()">
                    </div>
                </form>
                <div class="error" id="error">
                    <ion-icon id="icon" name="close-circle-outline"></ion-icon>
                    <h1>Contraseña incorrecta</h1>
                    <a href="javascript:document.location.reload();">Intentar de nuevo</a>
                </div>
            </div>
        </div>
    </div>
  </section>
  <script src="../js/index.js"></script>
  <script src="../js/particles.js"></script>
  <script src="../js/app.js"></script>
  <script type="module" src=" https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js "> </script>
  <script nomodule src=" https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js "> </script>
</body>

</html>
